<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | A/B Testing Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#131b2e",
                        "surface-variant": "#dae2fd",
                        "surface-container-lowest": "#ffffff",
                        "inverse-primary": "#c3c0ff",
                        "secondary-container": "#b6b4ff",
                        "surface-container-highest": "#dae2fd",
                        "primary-fixed": "#e2dfff",
                        "on-error": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-primary-fixed-variant": "#3323cc",
                        "on-tertiary-container": "#ffd2be",
                        "inverse-on-surface": "#eef0ff",
                        "tertiary-fixed-dim": "#ffb695",
                        "on-tertiary-fixed-variant": "#7b2f00",
                        "surface-dim": "#d2d9f4",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#e2e7ff",
                        "on-secondary-container": "#454386",
                        "outline": "#777587",
                        "outline-variant": "#c7c4d8",
                        "on-tertiary-fixed": "#351000",
                        "surface-tint": "#4d44e3",
                        "on-error-container": "#93000a",
                        "secondary": "#58579b",
                        "tertiary-container": "#a44100",
                        "surface-container-low": "#f2f3ff",
                        "on-primary-fixed": "#0f0069",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed": "#e2dfff",
                        "on-secondary-fixed-variant": "#413f82",
                        "error": "#ba1a1a",
                        "primary": "#3525cd",
                        "surface": "#faf8ff",
                        "secondary-fixed-dim": "#c3c0ff",
                        "background": "#faf8ff",
                        "on-secondary": "#ffffff",
                        "surface-container": "#eaedff",
                        "tertiary": "#7e3000",
                        "surface-bright": "#faf8ff",
                        "primary-container": "#4f46e5",
                        "primary-fixed-dim": "#c3c0ff",
                        "on-secondary-fixed": "#140f54",
                        "on-surface": "#131b2e",
                        "on-primary-container": "#dad7ff",
                        "on-surface-variant": "#464555",
                        "inverse-surface": "#283044",
                        "tertiary-fixed": "#ffdbcc"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1.5rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .ambient-shadow {
            box-shadow: 0 32px 64px -12px rgba(19, 27, 46, 0.08);
        }
    </style>
</head>
<body class="bg-surface min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
<!-- Subtle Background Gradient Elements -->
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-secondary-container/10 blur-[120px]"></div>
<!-- Login Container -->
<div class="w-full max-w-[480px] z-10">
<!-- Brand Identity / Top Navigation Suppressed (Focus Mode) -->
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-primary to-primary-container mb-6 ambient-shadow">
<span class="material-symbols-outlined text-white text-3xl" style="font-variation-settings: 'FILL' 1;">architecture</span>
</div>
<h1 class="text-3xl font-extrabold tracking-tight text-on-surface mb-2">A/B Testing Dashboard</h1>
<p class="text-on-surface-variant font-body">Track and optimize funnel performance</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-2xl p-10 ambient-shadow">
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-sm font-semibold tracking-wide text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative">
<input class="w-full h-14 px-5 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary/20 focus:bg-surface-bright transition-all text-on-surface placeholder:text-outline/50 font-body outline-none" id="email" placeholder="name@company.com" type="email"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-outline/40">
<span class="material-symbols-outlined">mail</span>
</div>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="block text-sm font-semibold tracking-wide text-on-surface-variant" for="password">Password</label>
<a class="text-xs font-semibold text-primary hover:opacity-80 transition-opacity" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="w-full h-14 px-5 rounded-xl bg-surface-container-low border-none focus:ring-2 focus:ring-primary/20 focus:bg-surface-bright transition-all text-on-surface placeholder:text-outline/50 font-body outline-none" id="password" placeholder="••••••••" type="password"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-outline/40">
<span class="material-symbols-outlined">lock</span>
</div>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center px-1">
<label class="relative flex items-center cursor-pointer group">
<input class="sr-only peer" type="checkbox"/>
<div class="w-5 h-5 bg-surface-container-high rounded-lg peer-checked:bg-primary transition-all flex items-center justify-center">
<span class="material-symbols-outlined text-white text-[16px] scale-0 peer-checked:scale-100 transition-transform">check</span>
</div>
<span class="ml-3 text-sm font-medium text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me on this device</span>
</label>
</div>
<!-- Primary CTA -->
<button class="w-full h-14 rounded-2xl bg-gradient-to-r from-primary to-primary-container text-white font-bold text-lg tracking-tight hover:opacity-95 active:scale-[0.98] transition-all ambient-shadow flex items-center justify-center gap-2" type="submit">
                    Sign In
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Social Login / Alternative Tier -->
<div class="mt-10 pt-8 border-t border-outline-variant/10">
<p class="text-center text-xs font-bold tracking-widest text-outline/60 uppercase mb-6">Or continue with</p>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center h-12 rounded-xl bg-surface-container-low hover:bg-surface-container-high transition-colors group">
<img class="w-5 h-5 mr-3 opacity-80 group-hover:opacity-100" data-alt="minimalist flat google icon logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC1OvKCKMEThfpWE-nIFpIDmd1ioNSuc0cejpE8rEiZbtb_Tsd7azMzRbHdullOeNQzqkEhs4A2MFOxPbLwq0ptTXtQBPF0Ix41QpjE3PdFbZzFkID9L3ajxx1s3dE48Rx_7Liopz3fa65QbJq1HddvuvXoFR8rQp_J94d3yGarH6T3RVG05VPV0EZkfJ3GKTeGK73XhSC2B4wkByIUm7e1d1dY62jpuHtoemjVaX4-Qk7KxU-yFEipCMc6pQNCimUxBQth7efBzes"/>
<span class="text-sm font-semibold text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center h-12 rounded-xl bg-surface-container-low hover:bg-surface-container-high transition-colors group">
<span class="material-symbols-outlined text-on-surface text-xl mr-3" style="font-variation-settings: 'FILL' 1;">terminal</span>
<span class="text-sm font-semibold text-on-surface">SSO</span>
</button>
</div>
</div>
</div>
<!-- Footer Help -->
<p class="text-center mt-8 text-sm text-on-surface-variant">
            Don't have an account? 
            <a class="text-primary font-bold hover:underline underline-offset-4 decoration-primary/30" href="#">Create a free workspace</a>
</p>
<!-- Technical Metadata (Bottom Anchor) -->
<div class="mt-12 flex justify-center gap-6 opacity-40">
<span class="text-[10px] font-bold tracking-widest uppercase text-on-surface-variant">System V4.2.1</span>
<span class="text-[10px] font-bold tracking-widest uppercase text-on-surface-variant">Privacy First</span>
<span class="text-[10px] font-bold tracking-widest uppercase text-on-surface-variant">Encrypted SSL</span>
</div>
</div>
<!-- Background Decorative Visual -->
<div class="hidden lg:block absolute top-1/2 right-[5%] -translate-y-1/2 w-64 h-96 opacity-20 pointer-events-none">
<div class="w-full h-full rounded-2xl bg-surface-container-high rotate-6 border border-primary/10"></div>
<div class="absolute inset-0 rounded-2xl bg-surface-container-low -rotate-3 border border-secondary/10 translate-x-4 translate-y-4"></div>
</div>
</body></html>
